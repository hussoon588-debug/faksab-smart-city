<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تنظيف نسخة اللعبة</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#050d1f;color:#e8eef8;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px}
.box{max-width:520px}
h1{font-size:20px;margin:0 0 10px;color:#f2c14e}
p{font-size:15px;line-height:1.7;margin:8px 0;color:#a9b8cf}
a{display:inline-block;margin-top:18px;padding:14px 26px;border-radius:14px;
background:linear-gradient(135deg,#f2c14e,#d99b25);color:#08152c;font-weight:700;text-decoration:none}
code{color:#f2c14e}
</style>
</head>
<body>
<div class="box">
  <h1>تنظيف النسخة القديمة</h1>
  <p>هذه الصفحة تمسح الكاش والعامل المخزَّن في المتصفح، حتى تُفتح اللعبة بأحدث نسخة.</p>
  <p id="state">جارٍ التنظيف…</p>
  <a href="./" id="go" style="display:none">افتح اللعبة الآن</a>
</div>
<script>
(async function () {
  var state = document.getElementById('state');
  var done = [];
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
      done.push(regs.length + ' عامل');
    }
  } catch (e) {}
  try {
    if (window.caches) {
      var keys = await caches.keys();
      await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      done.push(keys.length + ' كاش');
    }
  } catch (e) {}
  state.textContent = 'تم التنظيف (' + (done.join(' · ') || 'لا شيء لتنظيفه') + ').';
  document.getElementById('go').style.display = 'inline-block';
  setTimeout(function () { location.replace('./'); }, 1200);
})();
</script>
</body>
</html>
